services:
  db:
    image: postgis/postgis:17-3.5
    container_name: urbanpulse-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: urbanpulse
      POSTGRES_PASSWORD: urbanpulse_dev
      POSTGRES_DB: urbanpulse
    ports:
      - "5432:5432"
    volumes:
      - urbanpulse_data:/var/lib/postgresql/data

volumes:
  urbanpulse_data: